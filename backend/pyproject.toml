[project]
name = "appsec-pilot-backend"
version = "0.1.0"
description = "Backend API for AppSec Pilot"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic-settings>=2.5.0",
  "sqlalchemy>=2.0.32",
  "alembic>=1.13.2",
  "python-multipart>=0.0.9",
  "httpx>=0.27.0",
  "pyjwt>=2.9.0",
  "jinja2>=3.1.4",
  "reportlab>=4.2.2",
  "pyyaml>=6.0.2",
  "dramatiq>=1.17.0",
  "redis>=5.0.8",
  "psycopg[binary]>=3.2.1",
  "appsec-pilot-agent",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.2", "ruff>=0.6.2", "mypy>=1.11.1"]

[tool.uv.sources]
appsec-pilot-agent = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = [".", "../agent"]
testpaths = ["tests"]
