[project]
name = "appsec-pilot-cli"
version = "0.1.0"
description = "Command line interface for AppSec Pilot"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27.0", "typer>=0.12.3", "rich>=13.7.1", "pyyaml>=6.0.2"]

[project.scripts]
appsec = "appsec_cli.main:app"

[project.optional-dependencies]
dev = ["pytest>=8.3.2", "ruff>=0.6.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["appsec_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
