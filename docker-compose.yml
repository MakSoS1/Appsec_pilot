services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: appsec
      POSTGRES_PASSWORD: appsec_dev_password
      POSTGRES_DB: appsec
    ports:
      - "5432:5432"
    volumes:
      - appsec_pg:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: appsec
      MINIO_ROOT_PASSWORD: appsec_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - appsec_minio:/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://appsec:appsec_dev_password@postgres:5432/appsec
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: appsec
      MINIO_SECRET_KEY: appsec_dev_password
      LLM_BASE_URL: http://host.docker.internal:11434/v1
      LLM_API_KEY: local-dev-key
      LLM_MODEL: qwen35-hauhau-q4:latest
      FRONTEND_URL: http://localhost:3001
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
      - minio
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.workers.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://appsec:appsec_dev_password@postgres:5432/appsec
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: appsec
      MINIO_SECRET_KEY: appsec_dev_password
      LLM_BASE_URL: http://host.docker.internal:11434/v1
      LLM_API_KEY: local-dev-key
      LLM_MODEL: qwen35-hauhau-q4:latest
    depends_on:
      - backend

  frontend:
    build:
      context: frontend
    environment:
      VITE_API_URL: http://localhost:8080
    ports:
      - "3001:3000"
    depends_on:
      - backend

volumes:
  appsec_pg:
  appsec_minio:
